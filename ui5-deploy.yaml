# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.upao.s4publicupaosalmonitorreservas
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: UPAO_S4_CLOUD_PUBLIC_DEV_DEPLOY
          url: https://my425627.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZBSP_MONRESERV
          description: Monitor de Reservas
          package: ZS4PC_SAL_MONRESERV
          transport: A7XK900577
        exclude:
          - /test/
